<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Wish Game 🎂</title>

  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- Open in a browser, click Start, click/tap hearts to collect 10 hearts. -->
  <style>
    :root{ --accent:#ff4d6d; --accent-2:#ff758f; --glass: rgba(255,255,255,0.06); }
    html,body{height:100%;margin:0;font-family:Montserrat, Poppins, system-ui, sans-serif}
    body{
      display:flex;align-items:center;justify-content:center;padding:28px;overflow:hidden;
      /* animated gradient */
      background: linear-gradient( -45deg, #ff9a9e, #fad0c4, #a18cd1, #fbc2eb );
      background-size: 400% 400%;
      animation: gradientBG 18s ease infinite;
    }
    @keyframes gradientBG{ 0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%} }

    #game-area{ width:100%; max-width:920px; }
    .center{ text-align:center }

    /* animated glowing start button */
    .glow-btn{ --g: 0 0 18px rgba(255,77,109,0.28); transition: transform .18s ease, box-shadow .18s ease; box-shadow:var(--g); }
    .glow-btn:hover{ transform:translateY(-6px) scale(1.02); box-shadow:0 10px 40px rgba(255,77,109,0.28), 0 0 60px rgba(255,117,143,0.15); }
    .glow-btn::after{ content:""; position:absolute; left:-4px; right:-4px; top:-4px; bottom:-4px; border-radius:.375rem; pointer-events:none; background:linear-gradient(45deg, rgba(255,255,255,0.05), transparent); opacity:.0 }

  /* start screen styles */
  #start-screen{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:6000; background: rgba(6,6,10,0.9); backdrop-filter: blur(6px); transition: opacity .6s ease, transform .6s ease; }
  #start-screen.hide{ opacity:0; transform: scale(.995); pointer-events:none }
  .start-inner{ text-align:center; color:#eaf0ff; padding:48px; max-width:860px }
  .start-ghost{ font-weight:800; font-size:120px; letter-spacing:12px; color:rgba(255,255,255,0.06); transform:translateY(-10px); margin-bottom:-28px }
  .start-title{ font-size:20px; margin:8px 0 6px; color:#e9f0ff; font-weight:600 }
  .start-sub{ color:rgba(255,255,255,0.6); margin-bottom:20px }

  /* purple OPEN button (glossy, elevated) */
  .open-btn{ position:relative; display:inline-block; padding:14px 36px; border-radius:999px; border:0; font-weight:700; color:white; cursor:pointer; background:linear-gradient(90deg,#5b3bff,#7b53ff); box-shadow: 0 8px 28px rgba(91,59,255,0.22), 0 0 40px rgba(123,83,255,0.12); transition: transform .18s ease, box-shadow .18s ease; font-size:1rem }
  .open-btn:hover{ transform:translateY(-6px); box-shadow: 0 18px 60px rgba(91,59,255,0.26), 0 0 80px rgba(123,83,255,0.16) }
  .open-btn:active{ transform:translateY(-2px) scale(.995) }
  .open-btn::after{ content:""; position:absolute; left:10%; right:10%; top:50%; height:8px; background:linear-gradient(90deg, rgba(255,255,255,0.18), rgba(255,255,255,0.02)); border-radius:999px; transform:translateY(-50%); opacity:.9 }

  /* small pulse under button to attract attention */
  .open-btn::before{ content:""; position:absolute; left:50%; top:50%; width:22px; height:22px; transform:translate(-50%,-50%); border-radius:50%; background:radial-gradient(circle,#ffffff22,#0000); filter:blur(6px); opacity:.7 }

    canvas{ display:block; width:100%; height:420px; border-radius:14px; background:var(--glass); box-shadow: 0 12px 30px rgba(0,0,0,0.14); touch-action:none }
    #scoreText{ color:#fff; font-weight:600; margin-top:10px }

    #win-message{ display:none; color:#fff; animation: popIn .6s ease both }
    @keyframes popIn{ from{transform:scale(.9);opacity:0}to{transform:none;opacity:1} }

    /* gift system removed - unused gift CSS cleaned up */
    .flower{ position:fixed; left:0; top:0; pointer-events:none; transform-origin:center; will-change: transform, opacity }

  /* responsive */
  @media (max-width:640px){ canvas{height:320px} }
  /* final scene styles (single bouquet + neon title) */
  #final-scene{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:7000; background: radial-gradient(circle at 50% 20%, rgba(6,6,10,0.95), rgba(6,6,10,0.98)); }
  .final-inner{ text-align:center; color:#fff; padding:28px }
  .final-title{ font-size:48px; letter-spacing:6px; margin:8px 0 6px; font-weight:700; font-family: 'Montserrat', sans-serif }
  .final-title.neon{ color:#fbfbff; text-shadow: 0 0 8px rgba(255,255,255,0.6), 0 10px 30px rgba(123,83,255,0.18), 0 0 40px rgba(123,83,255,0.18); }
  .final-note{ color:rgba(255,255,255,0.7); margin-top:12px }
  .final-flowers{ display:flex; align-items:flex-end; justify-content:center; gap:18px; margin-top:18px }
  .final-flowers .bouquet{ width:360px; height:420px; display:block; filter: drop-shadow(0 28px 60px rgba(0,0,0,0.5)); }
  .final-inner{ opacity:0; transform:scale(.92); transition: all 650ms cubic-bezier(.2,.9,.2,1) }
  #final-scene.show .final-inner{ opacity:1; transform:none }
  /* bouquet bloom animation */
  .bloom { transform-origin:center bottom }
  .bloom-anim { animation: bloomIn 900ms cubic-bezier(.22,.9,.2,1) both }
  @keyframes bloomIn{ from{ transform: scale(.6) translateY(20px); opacity:0 } to{ transform: scale(1) translateY(0); opacity:1 } }
  </style>
</head>

<body>
  <div id="game-area" class="w-100">
    <!-- Start screen: full-screen hero with a stylish OPEN button -->
    <div id="start-screen">
      <div class="start-inner">
        <div class="start-ghost">DAY</div>
        <h1 class="start-title">Wishing you a day filled with love and joy!</h1>
        <p class="start-sub">Click to open your birthday surprise</p>
        <button id="start-btn" class="open-btn">OPEN ✨</button>
      </div>
    </div>

    <div id="game-container" style="display:none;">
      <canvas id="heartCanvas" width="800" height="420"></canvas>
      <div class="overlay-center">
        <h3 id="scoreText">Hearts Collected: 0 / 10</h3>
      </div>
    </div>

    <div id="win-message" class="overlay-center">
      <h2>🎉 Congratulations! You Win! 🎊</h2>
    </div>

    <!-- gift box removed per request; restart button moved into final scene -->
    <!-- final floral scene (appears after gift opens) -->
    <div id="final-scene" style="display:none;">
      <div class="final-inner">
        <h1 class="final-title neon">🎂 Happy Birthday 🎈</h1>
        <div class="final-flowers" id="final-flowers">
          <!-- bouquet will be injected here -->
        </div>
        <p class="final-note">Wishing you a beautiful year ahead 💖</p>
        <div class="center" style="margin-top:18px"><button id="restart-btn" class="btn btn-outline-light">Play Again</button></div>
      </div>
    </div>
    <!-- full-screen background canvas for floating hearts shown after opening gift -->
    <canvas id="bgCanvas" style="display:none; position:fixed; inset:0; z-index:2500; pointer-events:none;"></canvas>
  </div>

  <script>
  // Game contract: click/tap hearts to collect 10, then open gift and optionally restart
    const startBtn = document.getElementById('start-btn');
    const gameContainer = document.getElementById('game-container');
    const winMessage = document.getElementById('win-message');
  // gift system removed: no giftContainer/giftBox
  const birthdayMessage = null;
    const scoreText = document.getElementById('scoreText');

    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');

    // Resize canvas backing store to match CSS size for crispness
    function resizeCanvas() {
      const ratio = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.max(300, Math.floor(rect.width * ratio));
      canvas.height = Math.max(200, Math.floor(rect.height * ratio));
      ctx.setTransform(ratio,0,0,ratio,0,0);
    }
    window.addEventListener('resize', resizeCanvas);

    // Game state
    let hearts = []; // active hearts
    let score = 0;
    const need = 10;
    let spawnInterval = null;
    let animFrame = null;
    let running = false;

    function rand(min, max){ return Math.random()*(max-min)+min; }

    function createHeart(fromTop=true){
      const size = rand(18, 28);
      const x = rand(size, canvas.width/ (window.devicePixelRatio||1) - size);
      const y = fromTop ? -size - rand(10,100) : (canvas.height/(window.devicePixelRatio||1)) + size + rand(10,100);
      // vy positive when fromTop (falling down), negative when from bottom (rising up)
      const vy = fromTop ? rand(0.6, 1.6) : -rand(0.8, 2.2);
      const vx = rand(-0.6, 0.6);
      const wobble = rand(0, Math.PI*2);
      // small acceleration to make upward hearts gently accelerate
      const accel = fromTop ? 0.002 : -0.003;
      return { x, y, size, vx, vy, wobble, accel, fromTop, collected:false };
    }

    function drawHeart(x,y,size, scale=1){
      ctx.save();
      ctx.translate(x,y);
      ctx.scale(scale,scale);
      ctx.fillStyle = '#ff2d6d';
      ctx.beginPath();
      const s = size/2;
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-s, -s, -size, s/2, 0, size);
      ctx.bezierCurveTo(size, s/2, s, -s, 0, 0);
      ctx.fill();
      ctx.restore();
    }

    // animation loop
    function update(){
      ctx.clearRect(0,0, canvas.width, canvas.height);
      const scaleFactor = 1; // drawing already uses logical pixels
      for(let i=hearts.length-1;i>=0;i--){
        const h = hearts[i];
        // apply small acceleration for smoother vertical motion
        if(!h.collected && typeof h.accel === 'number') h.vy += h.accel;
        if(h.collected){
          // simple pop animation: scale up then fade
          if(!h._pop) h._pop = { t:0 };
          h._pop.t += 1/60;
          const t = h._pop.t;
          const scale = 1 + t*1.5;
          const alpha = Math.max(0, 1 - t*2);
          ctx.globalAlpha = alpha;
          drawHeart(h.x, h.y, h.size, scale);
          ctx.globalAlpha = 1;
          if(alpha<=0){ hearts.splice(i,1); }
          continue;
        }

  // movement
  h.wobble += 0.02;
  h.x += h.vx + Math.sin(h.wobble)*0.35;
  h.y += h.vy;

        // draw
        drawHeart(h.x, h.y, h.size);

        // remove if fully out-of-bounds
        if(h.y > canvas.height/(window.devicePixelRatio||1) + 120 || h.y < -140){
          hearts.splice(i,1);
        }
      }

      // HUD (score already in DOM but keep a small visual indicator optional)

      if(running) animFrame = requestAnimationFrame(update);
    }

    // spawn hearts periodically from top or bottom
    function startSpawning(){
      // spawn more often and favor hearts coming from bottom (rising up)
      spawnInterval = setInterval(()=>{
        if(score >= need) return;
        // keep active hearts at reasonable count
        if(hearts.length < 12){
          const fromTop = Math.random() < 0.25; // 75% from bottom (rise up)
          hearts.push(createHeart(fromTop));
        }
      }, 420);
    }

    // clicking / tapping to collect
    function getPointerPos(e){
      const rect = canvas.getBoundingClientRect();
      let clientX, clientY;
      if(e.touches){ clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
      else { clientX = e.clientX; clientY = e.clientY; }
      const x = (clientX - rect.left);
      const y = (clientY - rect.top);
      return { x, y };
    }

    function tryCollect(e){
      if(!running) return;
      const p = getPointerPos(e);
      // iterate from top to bottom to prioritize visible hearts
      for(let i=hearts.length-1;i>=0;i--){
        const h = hearts[i];
        if(h.collected) continue;
        const dx = p.x - h.x;
        const dy = p.y - h.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < h.size*0.95){
          // collect
          h.collected = true;
          score++;
          scoreText.textContent = `Hearts Collected: ${score} / ${need}`;
          // small floating emoji particle
          spawnEmoji(p.x, p.y);
          if(score >= need){
            win();
          }
          break;
        }
      }
    }

    // simple emoji float
    function spawnEmoji(x,y){
      const el = document.createElement('div');
      el.className = 'floating-emoji';
      const emojis = ['🎉','🎈','💖','🎂','🎁'];
      el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      document.body.appendChild(el);
      // position in page coordinates
      const rect = canvas.getBoundingClientRect();
      el.style.left = (rect.left + x - 12) + 'px';
      el.style.top = (rect.top + y - 12) + 'px';
      el.style.transition = 'transform 1200ms linear, opacity 1200ms linear';
      // trigger animation
      requestAnimationFrame(()=>{
        el.style.transform = 'translateY(-160px) translateX(' + (rand(-30,30)) + 'px)';
        el.style.opacity = '0';
      });
      setTimeout(()=>el.remove(), 1300);
    }

    function win(){
      // stop spawning and stop animation after a short delay to let last pops finish
      clearInterval(spawnInterval);
      running = false;
      // small delay then show win message and final reveal
      setTimeout(()=>{
        gameContainer.style.display = 'none';
        winMessage.style.display = 'block';
        // then show final scene directly (no gift box)
        setTimeout(()=>{
          winMessage.style.display = 'none';
          // burst flowers from center
          spawnFlowerBurstAt(window.innerWidth/2, window.innerHeight/2, 48);
          // start background hearts
          startBG();
          // show final floral scene
          showFinalScene();
        }, 900);
      }, 400);
    }

    // create a simple flower SVG string with two colors
    function createFlowerSVG(color1, color2, size){
      const s = Math.round(size);
      // simple 5-petal flower using circles/paths
      return `<?xml version="1.0" encoding="UTF-8"?><svg xmlns='http://www.w3.org/2000/svg' width='${s}' height='${s}' viewBox='0 0 64 64'>
        <defs>
          <radialGradient id='g1' cx='30%' cy='30%'>
            <stop offset='0%' stop-color='${color1}' />
            <stop offset='100%' stop-color='${color2}' />
          </radialGradient>
        </defs>
        <g transform='translate(32,32)'>
          <ellipse rx='10' ry='18' fill='url(#g1)' transform='rotate(0)'/>
          <ellipse rx='10' ry='18' fill='url(#g1)' transform='rotate(72)'/>
          <ellipse rx='10' ry='18' fill='url(#g1)' transform='rotate(144)'/>
          <ellipse rx='10' ry='18' fill='url(#g1)' transform='rotate(216)'/>
          <ellipse rx='10' ry='18' fill='url(#g1)' transform='rotate(288)'/>
          <circle r='8' fill='#fff7ea' />
        </g>
      </svg>`;
    }

    // spawn a single flower element from (sx,sy) in page coordinates, with random trajectory
    function spawnFlower(sx, sy, delay=0){
      const size = rand(24, 56);
      const colors = [ ['#ff7aa2','#ff5a8f'], ['#ffd06b','#ff9b6b'], ['#ffd1f0','#ff7adf'], ['#a0d995','#5ec47a'], ['#ffd0e0','#ff8cb3'] ];
      const c = colors[Math.floor(Math.random()*colors.length)];
      const svg = createFlowerSVG(c[0], c[1], size);
      const el = document.createElement('div');
      el.className = 'flower';
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.style.left = (sx - size/2) + 'px';
      el.style.top = (sy - size/2) + 'px';
      el.style.opacity = '1';
      el.style.zIndex = 9999;
      el.style.transform = `translate3d(0px,0px,0) scale(.4) rotate(${rand(0,360)}deg)`;
      el.innerHTML = svg;
      document.body.appendChild(el);

      // compute random target offset so flowers spread across the screen
      const angle = rand(-Math.PI, Math.PI);
      const distance = rand(120, 520);
      const tx = Math.cos(angle) * distance + rand(-60,60);
      const ty = Math.sin(angle) * distance - rand(10,220);
      const rot = rand(-720,720);
      const dur = rand(1100, 2400);

      setTimeout(()=>{
        el.style.transition = `transform ${dur}ms cubic-bezier(.17,.9,.3,1), opacity ${dur}ms ease-out`;
        requestAnimationFrame(()=>{
          el.style.transform = `translate3d(${tx}px, ${ty}px, 0) scale(1) rotate(${rot}deg)`;
          el.style.opacity = '0';
        });
      }, delay);

      setTimeout(()=> el.remove(), dur + delay + 60);
    }

    // spawn many flowers from center of gift
    function spawnFlowerBurst(count=36){
      // default to center of viewport
      spawnFlowerBurstAt(window.innerWidth/2, window.innerHeight/2, count);
    }

    function spawnFlowerBurstAt(sx, sy, count=36){
      for(let i=0;i<count;i++){
        spawnFlower(sx + rand(-32,32), sy + rand(-18,18), i*28);
      }
    }

    // gift system removed — final reveal is triggered by win() directly

    // show final full-screen floral scene as a single stylized bouquet
    const finalScene = document.getElementById('final-scene');
    const finalFlowers = document.getElementById('final-flowers');
    function showFinalScene(){
      if(!finalScene) return;
      finalFlowers.innerHTML = '';
      // single tall bouquet SVG (stylized white flowers with leaves and stems)
      const bouquetSVG = `
        <svg class='bouquet bloom bloom-anim' viewBox='0 0 300 360' xmlns='http://www.w3.org/2000/svg'>
          <defs>
            <linearGradient id='stemG' x1='0' x2='0' y1='0' y2='1'>
              <stop offset='0%' stop-color='#6fbf73'/>
              <stop offset='100%' stop-color='#2f7b4a'/>
            </linearGradient>
            <linearGradient id='petalG' x1='0' x2='1' y1='0' y2='1'>
              <stop offset='0%' stop-color='#ffffff'/>
              <stop offset='100%' stop-color='#f2f8ff'/>
            </linearGradient>
            <filter id='soft' x='-50%' y='-50%' width='200%' height='200%'>
              <feGaussianBlur stdDeviation='6' result='b'/>
              <feBlend in='SourceGraphic' in2='b'/>
            </filter>
          </defs>
          <!-- stems -->
          <g fill='none' stroke='url(#stemG)' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'>
            <path d='M150 260 C150 220 140 180 140 140' />
            <path d='M160 260 C170 220 190 180 200 140' />
            <path d='M140 300 C135 260 120 210 110 160' />
            <path d='M170 300 C175 260 200 210 210 160' />
          </g>
          <!-- leaves -->
          <g fill='url(#stemG)'>
            <path d='M138 210 C120 200 110 190 118 176 C130 156 156 168 146 186 C142 195 142 201 138 210Z' opacity='0.95'/>
            <path d='M192 210 C210 200 220 190 212 176 C200 156 174 168 184 186 C188 195 188 201 192 210Z' opacity='0.95'/>
          </g>
          <!-- flowers (three tall white flowers) -->
          <g transform='translate(150,100)'>
            <g class='flower1'>
              <ellipse cx='0' cy='-40' rx='18' ry='34' fill='url(#petalG)' transform='rotate(0)' />
              <ellipse cx='0' cy='-40' rx='18' ry='34' fill='url(#petalG)' transform='rotate(60)' />
              <ellipse cx='0' cy='-40' rx='18' ry='34' fill='url(#petalG)' transform='rotate(120)' />
              <circle cx='0' cy='-40' r='8' fill='#fff7d9' />
            </g>
            <g class='flower2' transform='translate(-28,22)'>
              <ellipse cx='0' cy='-20' rx='14' ry='26' fill='url(#petalG)' transform='rotate(0)' />
              <ellipse cx='0' cy='-20' rx='14' ry='26' fill='url(#petalG)' transform='rotate(60)' />
              <ellipse cx='0' cy='-20' rx='14' ry='26' fill='url(#petalG)' transform='rotate(120)' />
              <circle cx='0' cy='-20' r='6' fill='#fff7d9' />
            </g>
            <g class='flower3' transform='translate(28,28)'>
              <ellipse cx='0' cy='-18' rx='12' ry='22' fill='url(#petalG)' transform='rotate(0)' />
              <ellipse cx='0' cy='-18' rx='12' ry='22' fill='url(#petalG)' transform='rotate(60)' />
              <ellipse cx='0' cy='-18' rx='12' ry='22' fill='url(#petalG)' transform='rotate(120)' />
              <circle cx='0' cy='-18' r='5' fill='#fff7d9' />
            </g>
          </g>
        </svg>
      `;
      finalFlowers.innerHTML = bouquetSVG;
      finalScene.style.display = 'flex';
      requestAnimationFrame(()=> finalScene.classList.add('show'));
      // small staggered bloom for each flower group
      const blooms = finalFlowers.querySelectorAll('.bloom');
      blooms.forEach((b,i)=>{ b.style.transition = `transform .9s cubic-bezier(.2,.9,.2,1) ${i*80}ms, opacity .9s ${i*80}ms`; b.style.opacity = 1; });
    }

  // restart support
  const restartBtn = document.getElementById('restart-btn');
    function resetGame(){
      // clear state
      clearInterval(spawnInterval); spawnInterval = null;
      running = false;
      hearts = [];
      score = 0; scoreText.textContent = `Hearts Collected: ${score} / ${need}`;
  // gift removed: clear any gift-related state
  // birthdayMessage/giftContainer/giftBox no longer exist
      // remove any remaining flower elements
      document.querySelectorAll('.flower').forEach(n=>n.remove());
      // remove any temporary overlays
      document.querySelectorAll('body > div').forEach(d=>{
        // rough heuristic: our overlay had no id and zIndex 4000 - remove small fixed overlays with pointerEvents none
        try{ const s = window.getComputedStyle(d); if(s.position==='fixed' && s.pointerEvents==='none') d.remove(); }catch(e){}
      });
      winMessage.style.display = 'none';
      gameContainer.style.display = 'block';
      startBtn.style.display = 'none';
      running = true;
      resizeCanvas();
      for(let i=0;i<4;i++) hearts.push(createHeart(Math.random()<0.6));
      startSpawning();
      cancelAnimationFrame(animFrame);
      animFrame = requestAnimationFrame(update);
      // stop and clear background hearts
      stopBG();
      // hide final scene
      if(finalScene){ finalScene.classList.remove('show'); setTimeout(()=>{ if(finalScene) finalScene.style.display='none'; finalFlowers.innerHTML=''; }, 360); }
      // reset canvas background
      canvas.style.background = 'var(--glass)';
    }
    restartBtn.addEventListener('click', resetGame);

    // input listeners
    canvas.addEventListener('click', tryCollect);
    canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); tryCollect(e); }, { passive:false });

    // ===== background heart particles (full-screen) =====
    const bgCanvas = document.getElementById('bgCanvas');
    const bgCtx = bgCanvas.getContext && bgCanvas.getContext('2d');
    let bgParticles = [];
    let bgAnim = null;
    let bgRunning = false;

    function resizeBG(){
      if(!bgCanvas) return;
      const ratio = window.devicePixelRatio || 1;
      bgCanvas.width = Math.floor(window.innerWidth * ratio);
      bgCanvas.height = Math.floor(window.innerHeight * ratio);
      bgCanvas.style.width = window.innerWidth + 'px';
      bgCanvas.style.height = window.innerHeight + 'px';
      if(bgCtx) bgCtx.setTransform(ratio,0,0,ratio,0,0);
    }
    window.addEventListener('resize', resizeBG);

    function createBGParticle(fromTop){
      const size = rand(6, 14);
      const x = rand(size, window.innerWidth - size);
      const y = fromTop ? -size - rand(0,120) : window.innerHeight + size + rand(0,120);
      const vy = fromTop ? rand(0.6, 1.4) : -rand(0.8,1.8);
      const vx = rand(-0.4, 0.4);
      const wobble = rand(0, Math.PI*2);
      const hue = Math.floor(rand(330, 360));
      return { x, y, size, vx, vy, wobble, fromTop };
    }

    function drawBGHeart(p){
      // simple heart path scaled to p.size
      const x = p.x, y = p.y, s = p.size;
      bgCtx.save();
      bgCtx.translate(x,y);
      bgCtx.scale(1,1);
      bgCtx.fillStyle = 'rgba(255,77,109,0.95)';
      bgCtx.beginPath();
      bgCtx.moveTo(0, 0);
      bgCtx.bezierCurveTo(-s/2, -s/2, -s, s/3, 0, s);
      bgCtx.bezierCurveTo(s, s/3, s/2, -s/2, 0, 0);
      bgCtx.closePath();
      bgCtx.fill();
      bgCtx.restore();
    }

    function updateBG(){
      if(!bgCtx) return;
      bgCtx.clearRect(0,0,bgCanvas.width, bgCanvas.height);
      for(let i=bgParticles.length-1;i>=0;i--){
        const p = bgParticles[i];
        p.wobble += 0.02;
        p.x += p.vx + Math.sin(p.wobble)*0.2;
        p.y += p.vy;
        drawBGHeart(p);
        // recycle if out of bounds
        if(p.fromTop && p.y > window.innerHeight + 40) bgParticles.splice(i,1);
        else if(!p.fromTop && p.y < -40) bgParticles.splice(i,1);
      }
      if(bgRunning) bgAnim = requestAnimationFrame(updateBG);
    }

    function startBG(){
      if(!bgCanvas) return;
      resizeBG();
      bgParticles = [];
      bgCanvas.style.display = 'block';
      bgRunning = true;
      // initial burst
      for(let i=0;i<32;i++){ bgParticles.push(createBGParticle(Math.random()<0.75)); }
      // continuous spawning - favor bottom->up
      bgSpawn = setInterval(()=>{
        if(bgParticles.length < 120){ bgParticles.push(createBGParticle(Math.random()<0.75)); }
      }, 180);
      cancelAnimationFrame(bgAnim);
      bgAnim = requestAnimationFrame(updateBG);
    }

    function stopBG(){
      bgRunning = false;
      if(typeof bgSpawn !== 'undefined') clearInterval(bgSpawn);
      cancelAnimationFrame(bgAnim);
      if(bgCanvas){ bgCanvas.style.display = 'none'; }
      bgParticles = [];
      if(bgCtx) bgCtx.clearRect(0,0,bgCanvas.width, bgCanvas.height);
    }


    // Start game (open button triggers start-screen hide then game start)
    const startScreen = document.getElementById('start-screen');
    startBtn.addEventListener('click', ()=>{
      // animate hide
      if(startScreen){ startScreen.classList.add('hide'); }
      // after fade, start the game
      setTimeout(()=>{
        if(startScreen) startScreen.style.display = 'none';
        gameContainer.style.display = 'block';
        score = 0; scoreText.textContent = `Hearts Collected: ${score} / ${need}`;
        hearts = [];
        running = true;
        resizeCanvas();
        // give the game canvas a soft pink background to match reference
        canvas.style.background = '#ffeaf0';
        // create a few initial hearts
        for(let i=0;i<5;i++){ hearts.push(createHeart(Math.random()<0.6)); }
        startSpawning();
        cancelAnimationFrame(animFrame);
        animFrame = requestAnimationFrame(update);
      }, 520);
    });

    // initial resize
    setTimeout(resizeCanvas, 50);
  </script>
</body>
</html>
